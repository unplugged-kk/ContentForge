name: Production DB Migrate

on:
  push:
    branches: [main, master, replit]
  workflow_dispatch:

jobs:
  migrate:
    name: Migrate Production Database
    runs-on: ubuntu-latest
    if: ${{ secrets.RAILWAY_DATABASE_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply ordered Drizzle migrations to Railway Postgres
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: npm run db:migrate
