version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: contentforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cfuser
      POSTGRES_PASSWORD: cfpass
      POSTGRES_DB: contentforge
    ports:
      - "5432:5432"
    volumes:
      - contentforge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfuser -d contentforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  contentforge_pg_data:
