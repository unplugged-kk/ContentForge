version: "3.8"

# Docker Compose to run both Postgres database and the ContentForge application.
# Start all services: docker compose up --build -d
# Stop and clean up: docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: contentforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cfuser
      POSTGRES_PASSWORD: cfpass
      POSTGRES_DB: contentforge
    ports:
      - "5432:5432"
    volumes:
      - contentforge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfuser -d contentforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contentforge-app
    restart: unless-stopped
    ports:
      - "3000:5000"
    environment:
      DATABASE_URL: postgresql://cfuser:cfpass@postgres:5432/contentforge
      SESSION_SECRET: change-me-in-production
      AI_API_KEY: ${AI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Pass through or fallback for optional configs
      XQUIK_API_BASE_URL: ${XQUIK_API_BASE_URL:-https://xquik.com/api/v1}
      XQUIK_API_KEY: ${XQUIK_API_KEY}
      XQUIK_ACCOUNT: ${XQUIK_ACCOUNT}
      XQUIK_ALLOW_WRITE_RETRIES: ${XQUIK_ALLOW_WRITE_RETRIES:-0}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  contentforge_pg_data:
