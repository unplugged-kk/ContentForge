name: contentforge-test

# Ephemeral Postgres for `make test-db`. Does not touch the app database
# (127.0.0.1:5432) or the Playwright database (127.0.0.1:5433).
# Data is discarded with: make test-db-down

services:
  postgres:
    image: postgres:16-alpine
    container_name: contentforge-test-pg
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: contentforge_test
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d contentforge_test"]
      interval: 2s
      timeout: 5s
      retries: 15
